<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f5;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#dde2ea;--win:#0f9d7a;--winbg:#d8f3ea;--loss:#d6455d;--lossbg:#fbe0e5;--acc:#2b50d9}
:root[data-theme=dark]{--bg:#0e1424;--card:#172038;--ink:#e8ecf6;--mute:#8f9bb8;--line:#27324f;--win:#3ddbb0;--winbg:#12382f;--loss:#ff7088;--lossbg:#42202b;--acc:#7a95ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--card:#172038;--ink:#e8ecf6;--mute:#8f9bb8;--line:#27324f;--win:#3ddbb0;--winbg:#12382f;--loss:#ff7088;--lossbg:#42202b;--acc:#7a95ff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:20px;margin:6px 0 12px;font-weight:600}
h2{font-size:15px;margin:16px 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat small{color:var(--mute);display:block;font-size:12px}.stat b{font-size:18px}
.win{color:var(--win)}.loss{color:var(--loss)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mute);font-size:12px;padding:2px 0}
.day{position:relative;min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--card);padding:4px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.day.w{background:var(--winbg);border-color:var(--win)}.day.l{background:var(--lossbg);border-color:var(--loss)}
.day.bd{border:2px solid var(--loss);box-shadow:0 0 0 2px var(--lossbg)}
.qf{display:grid;grid-template-columns:1fr 1.2fr auto;gap:8px;margin-top:8px}
.lg{width:100%;border-collapse:collapse;font-size:13px}.lg th,.lg td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.lg th:first-child,.lg td:first-child{text-align:left}.lg button{min-height:28px;padding:0 8px}
.pwbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;padding:14px 10px;border:2px dashed var(--acc);border-radius:10px;text-align:center;background:var(--bg);user-select:all;word-break:break-all;margin-top:8px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.emo button{min-height:36px;padding:2px 8px;font-size:18px;line-height:1}
#tprev img{max-width:100%;border-radius:8px;margin-top:8px;display:block}
.shot button.ed1{left:4px;right:auto}
dialog#dlg2{width:min(760px,97vw);max-height:94vh;overflow:auto}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.sw{width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;border:2px solid var(--line)}.sw.on{outline:3px solid var(--acc);outline-offset:1px}
.szl{display:flex;align-items:center;gap:6px;margin:0;color:var(--mute)}.szl input{width:90px;min-height:0;padding:0}
.cv canvas{max-width:100%;height:auto;touch-action:none;cursor:crosshair;border:1px solid var(--line);border-radius:8px;display:block}
.bar2{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:4px 0 8px}.bar2 i{display:block;height:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day.sel{outline:2px solid var(--acc)}.day.today b{text-decoration:underline}
.day.empty{visibility:hidden}.day .pn{font-weight:600;font-size:11px;word-break:break-all}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.hi{color:var(--loss);border-color:var(--loss)}
.card img{max-width:100%;border-radius:8px;margin-top:8px;cursor:zoom-in;display:block}
.muted{color:var(--mute)}
.acc{display:flex;gap:8px;align-items:center}.acc small{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
[hidden]{display:none!important}
.nt{position:absolute;top:3px;left:24px;font-size:11px;font-style:normal;line-height:1;color:var(--acc)}
.cam{position:absolute;bottom:3px;right:3px;font-size:10px;font-style:normal;line-height:1}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:8px}
.shot{position:relative}.shot img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.shot button{position:absolute;top:4px;right:4px;min-height:28px;padding:2px 8px;background:var(--card)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:8px 2px;font-size:14px;flex:1;max-width:190px;border:0;border-radius:0;background:none;min-height:52px;color:var(--mute)}
nav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 2px var(--acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(440px,94vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{padding:4px 10px;min-height:32px;font-size:13px}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
a{color:var(--acc)}.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.links a{border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-decoration:none;background:var(--card)}
.note{font-size:13px;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
</style></head><body><main>
<div class="bar"><h1>Trading Journal</h1><span class="acc"><span id="acct"></span><button id="theme" aria-label="Toggle theme">Theme</button></span></div>
<div id="view"></div></main>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<script>
const MAJ=['USD','EUR','GBP','JPY','AUD','CAD','CHF','NZD'];
const PAIRS=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURJPY','GBPJPY','XAUUSD','XAGUSD','US30','NAS100','SPX500','US02Y','US05Y','US10Y','US30Y'];
const TVS={XAUUSD:'OANDA:XAUUSD',XAGUSD:'OANDA:XAGUSD',US30:'OANDA:US30USD',NAS100:'OANDA:NAS100USD',SPX500:'OANDA:SPX500USD',US02Y:'TVC:US02Y',US05Y:'TVC:US05Y',US10Y:'TVC:US10Y',US30Y:'TVC:US30Y'};
const LBL={XAUUSD:'XAUUSD Gold',XAGUSD:'XAGUSD Silver',US30:'US30 Dow',US02Y:'US 2Y',US05Y:'US 5Y',US10Y:'US 10Y',US30Y:'US 30Y'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={trades:[],events:[],shots:[]},tab='cal',cur=new Date(),sel=iso(new Date()),fc=new Set(MAJ),chartSym='EURUSD',warn='';
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const v=localStorage.getItem('tj1');if(v)S=JSON.parse(v)}catch(e){}S.shots=S.shots||[];S.trades=S.trades||[];S.events=S.events||[];
  try{S.tz=S.tz||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';new Intl.DateTimeFormat('en',{timeZone:S.tz})}catch(e){S.tz='UTC'}
  if((S.seedv||0)<2){const first=!S.seeded;S.seeded=1;S.seedv=2;
    const E=(id,date,time,cur,title,utc)=>Object.assign({id,date,time,cur,title},utc?{utc}:{});
    S.events.push(...(first?[E('s1','2026-10-02','08:30','USD','Non-Farm Payrolls','2026-10-02T12:30:00.000Z'),E('s2','2026-10-07','14:00','USD','FOMC Meeting Minutes','2026-10-07T18:00:00.000Z')]:[]),
      E('s3','2026-10-28','','NZD','RBNZ Rate Decision','2026-10-28T01:00:00.000Z'),
      E('s4','2026-10-28','','USD','FOMC Rate Decision','2026-10-28T18:00:00.000Z'),
      E('s5','2026-10-30','','JPY','BoJ Rate Decision'),
      E('s6','2026-11-03','','AUD','RBA Rate Decision','2026-11-03T03:30:00.000Z'),
      E('s7','2026-11-05','','GBP','BoE Rate Decision (MPC)','2026-11-05T12:00:00.000Z'),
      E('s8','2026-12-10','','CHF','SNB Rate Decision','2026-12-10T08:30:00.000Z'));save()}}
const TZS=[['America/New_York','New York'],['America/Chicago','Chicago'],['America/Los_Angeles','Los Angeles'],['UTC','UTC'],['Europe/London','London'],['Europe/Berlin','Frankfurt / Paris'],['Europe/Zurich','Zurich'],['Africa/Lagos','Lagos'],['Africa/Johannesburg','Johannesburg'],['Asia/Dubai','Dubai'],['Asia/Kolkata','India'],['Asia/Singapore','Singapore'],['Asia/Hong_Kong','Hong Kong'],['Asia/Tokyo','Tokyo'],['Australia/Sydney','Sydney'],['Pacific/Auckland','Auckland']];
function tzOff(ms,tz){const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(ms).map(x=>[x.type,x.value]));return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)-ms}
function toUTC(date,time,tz){const[y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number),g=Date.UTC(y,m-1,d,h,mi);let t=g-tzOff(g,tz);t=g-tzOff(t,tz);return new Date(t).toISOString()}
function loc(utc){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:S.tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(Date.parse(utc)).map(x=>[x.type,x.value]));return{date:`${p.year}-${p.month}-${p.day}`,time:`${p.hour}:${p.minute}`}}
function tzName(){return new Intl.DateTimeFormat('en',{timeZone:S.tz,timeZoneName:'short'}).format(new Date()).split(' ').pop()}
function evs(){return S.events.map(e=>e.utc?{...e,...loc(e.utc)}:e)}
function tzOpts(sel){const l=TZS.some(z=>z[0]===sel)?TZS:[[sel,sel],...TZS];return l.map(([v,n])=>`<option value="${v}" ${v===sel?'selected':''}>${n}</option>`).join('')}
function save(){dirty=true;try{localStorage.setItem('tjd','1')}catch(e){}clearTimeout(pt);pt=setTimeout(push,700);try{localStorage.setItem('tj1',JSON.stringify(S));warn=''}catch(e){warn='Storage is full. Delete old screenshots to keep saving.'}}
const money=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(2);
const cls=n=>n>0?'win':n<0?'loss':'';
const sum=a=>a.reduce((x,t)=>x+t.pnl,0);

function render(){
  $('#nav').innerHTML=[['cal','Calendar'],['jr','Journal'],['ch','Charts'],['nw','News'],['cap','Capital']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
  $('#view').innerHTML=({cal:vCal,jr:vJr,ch:vCh,nw:vNw,cap:vCap})[tab]()+(warn?`<p class="loss">${warn}</p>`:'');paintAcct();
}
const pc=(n,d=1)=>(n>=0?'+':'−')+Math.abs(n).toFixed(d)+'%';
function stats(list){const w=list.filter(t=>t.pnl>0).length,l=list.filter(t=>t.pnl<0).length,n=list.length,p=sum(list);
  const c=(a,b,k='')=>`<div class="stat"><small>${a}</small><b class="${k}">${b}</b></div>`;
  return `<div class="stats">${c('Net P&amp;L',money(p),cls(p))}${capital()>0?c('Account return',pc(p/capital()*100,2),cls(p)):''}${c('Win rate',n?(w/n*100).toFixed(0)+'%':'0%','win')}${c('Loss rate',n?(l/n*100).toFixed(0)+'%':'0%','loss')}${c('Trades',n)}</div>`}
function tradeCard(t){return `<div class="card"><div class="row"><b>${esc(t.pair)} <span class="tag">${t.side}</span></b><b class="${cls(t.pnl)}">${money(t.pnl)}</b></div><div class="muted">${t.date}</div>${t.notes?`<div>${esc(t.notes)}</div>`:''}${t.img?`<img src="${t.img}" alt="Trade screenshot" data-z="1"><button data-edt="${t.id}" style="margin-top:6px">✏️ Draw on screenshot</button>`:''}<div class="row" style="margin-top:8px"><span></span><button data-del="${t.id}">Delete</button></div></div>`}
function evCard(e){return `<div class="card row"><div><span class="tag hi">High</span> <b>${e.cur}</b> ${esc(e.title)}<div class="muted">${e.date} ${e.time||''}${e.utc&&e.time?' '+tzName():''}</div></div><button data-dele="${e.id}" aria-label="Delete event">✕</button></div>`}

const capital=()=>(+S.bal||0)+(S.caps||[]).reduce((a,c)=>a+(+c.amt||0),0);
function risk(){
  const b=capital();if(b<=0)return null;
  const dl=+(S.dl??5),ol=+(S.ol??10),tr=S.olt==='trailing',dLim=b*dl/100,oLim=b*ol/100;
  const byDay={};S.trades.forEach(t=>byDay[t.date]=(byDay[t.date]||0)+t.pnl);
  let bal=b,peak=b,over='';const dayB=[],log=[];
  for(const d of Object.keys(byDay).sort()){
    const p=byDay[d];if(dl>0&&-p>=dLim-1e-9)dayB.push(d);
    bal+=p;peak=Math.max(peak,bal);
    if(ol>0&&!over&&bal<=(tr?peak:b)-oLim+1e-9)over=d;
    const down=Math.max(0,(tr?peak:b)-bal);
    log.push({d,p,bal,pct:p/b*100,dl:dLim?Math.max(0,-p)/dLim*100:0,od:oLim?down/oLim*100:0,hit:dl>0&&-p>=dLim-1e-9,br:over===d,q:S.trades.some(t=>t.date===d&&t.pair==='Daily P&L')});
  }
  const tp=byDay[iso(new Date())]||0,floor=(tr?peak:b)-oLim;
  return{log,b,dl,ol,dLim,oLim,tr,bal,peak,floor,byDay,dayB,over,tp,dUsed:Math.max(0,-tp),oUsed:Math.max(0,(tr?peak:b)-bal)};
}
function riskCard(){
  const r=risk();
  if(!r)return `<div class="note">Enter your prop firm account capital in the Journal tab to track your daily and overall loss limits.</div>`;
  const f=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  const dp=r.dLim?r.dUsed/r.dLim*100:0,op=r.oLim?r.oUsed/r.oLim*100:0,mx=Math.max(dp,op);
  const col=p=>p>=100?'var(--loss)':p>=70?'var(--warn,#d98a00)':'var(--win)';
  const st=r.over?['BREACHED','loss']:dp>=100?['DAILY LIMIT HIT','loss']:mx>=70?['NEAR LIMIT','']:['SAFE','win'];
  const bar=(p)=>`<div class="bar2"><i style="width:${Math.min(100,p).toFixed(0)}%;background:${col(p)}"></i></div>`;
  return `<div class="card"><div class="row"><b>Prop firm limits</b><b class="${st[1]}">${st[0]}</b></div>
  <div class="muted">Balance ${f(r.bal)} · capital ${f(r.b)}</div>
  <div style="margin-top:8px">Daily loss today: <b>${f(r.dUsed)}</b> of ${f(r.dLim)} (${r.dl}%)</div>${bar(dp)}
  <div class="muted" style="margin-top:-4px;font-size:13px">${dp>=100?'Daily limit reached. Stop trading today.':'Left today: '+f(Math.max(0,r.dLim-r.dUsed))}</div>
  <div style="margin-top:8px">Overall loss: <b>${f(r.oUsed)}</b> of ${f(r.oLim)} (${r.ol}%, ${r.tr?'trailing':'static'})</div>${bar(op)}
  <div class="muted" style="margin-top:-4px;font-size:13px">${op>=100?'Overall limit reached.':'Left before breach: '+f(Math.max(0,r.oLim-r.oUsed))} · Breach level ${f(r.floor)}</div>
  ${r.over?`<p class="loss" style="margin:8px 0 0"><b>Account breached on ${r.over}.</b></p>`:''}
  ${r.dayB.length?`<p class="loss" style="margin:8px 0 0">Daily limit broken on: ${r.dayB.slice(-6).join(', ')}${r.dayB.length>6?' …':''}</p>`:''}
  <p class="muted" style="margin:8px 0 0;font-size:12px">Based on closed trades by close date. Your firm's rules, reset time and floating losses may differ, so check your firm's dashboard.</p></div>`;
}
const EMO=['😀','😎','😐','😟','😡','😰','🤯','😴','🎯','✅','❌','💰','📈','📉','🔥','⚠️','🧠','💪','🙏','🤞'];
const emoBar=id=>`<div class="emo" id="${id}" aria-label="Insert emoji">${EMO.map(e=>`<button type="button" aria-label="Insert ${e}">${e}</button>`).join('')}</div>`;
function wireEmo(id,ta){const t=$('#'+ta);$('#'+id).onclick=e=>{const b=e.target.closest('button');if(!b)return;const s=t.selectionStart??t.value.length,en=t.selectionEnd??s,c=b.textContent;t.value=t.value.slice(0,s)+c+t.value.slice(en);t.focus();t.selectionStart=t.selectionEnd=s+c.length}}
let pendingImg='';
function wireTrade(){
  pendingImg='';wireEmo('emo1','tn');
  const show=()=>{$('#tprev').hidden=!pendingImg;if(pendingImg)$('#pimg').src=pendingImg};
  $('#tfile').onchange=async e=>{const f=e.target.files[0];pendingImg=f?await shrink(f):'';show()};
  $('#ped').onclick=()=>openEditor(pendingImg,v=>{pendingImg=v;show()});
  $('#prm').onclick=()=>{pendingImg='';$('#tfile').value='';show()};
}
function openEditor(src,done){
  const d=$('#dlg2'),im=new Image();
  im.onerror=()=>{warn='Could not open that image for drawing.';render()};
  im.onload=()=>{
    const W=Math.min(im.width,900),H=Math.round(im.height*W/im.width),C=['#e5334b','#16a34a','#f5c400','#2b50d9','#ffffff','#111111'];
    d.innerHTML=`<b>Draw on screenshot</b>
    <div class="tools" role="toolbar">${C.map((c,i)=>`<button type="button" class="sw ${i?'':'on'}" data-col="${c}" style="background:${c}" aria-label="Pen color ${i+1}"></button>`).join('')}<label class="szl">Size <input type="range" id="sz" min="2" max="16" value="4"></label><button type="button" id="un">Undo</button><button type="button" id="rs">Reset</button></div>
    <div class="cv"><canvas id="cv" width="${W}" height="${H}"></canvas></div>
    <div class="row" style="margin-top:10px"><button type="button" id="ca">Cancel</button><button type="button" class="p" id="sv">Save drawing</button></div>`;
    if(!d.open)d.showModal();
    const cv=$('#cv'),x=cv.getContext('2d'),hist=[];let col=C[0],draw=false,last=null;
    const base=()=>x.drawImage(im,0,0,W,H),snap=()=>{hist.push(x.getImageData(0,0,W,H));if(hist.length>20)hist.shift()};
    base();snap();
    const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/(r.width||W),(e.clientY-r.top)*H/(r.height||H)]};
    cv.onpointerdown=e=>{e.preventDefault();draw=true;last=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
      x.strokeStyle=x.fillStyle=col;x.lineWidth=+$('#sz').value;x.lineCap=x.lineJoin='round';x.beginPath();x.arc(last[0],last[1],x.lineWidth/2,0,6.283);x.fill()};
    cv.onpointermove=e=>{if(!draw)return;const p=pt(e);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p};
    const end=()=>{if(draw){draw=false;snap()}};cv.onpointerup=end;cv.onpointercancel=end;
    d.onclick=e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.col){col=b.dataset.col;d.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s===b))}
      else if(b.id==='un'&&hist.length>1){hist.pop();x.putImageData(hist[hist.length-1],0,0)}
